name: Daily Fact

on:
  schedule:
    - cron: '0 1 * * *'  # 1am UTC = 1am Iceland time (UTC+0, no DST)
  workflow_dispatch:      # allow manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: content-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate daily fact
        env:
          # Azure OpenAI is used when both are set; Gemini is the fallback.
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/generate_fact.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fact.json days data
          git diff --staged --quiet || git commit -m "Dagleg staðreynd $(date -u +%Y-%m-%d)"
          git pull --rebase -q || true
          git push
